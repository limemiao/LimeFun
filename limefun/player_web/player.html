<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LimeFun Player · 播放</title>
  <link rel="stylesheet" href="/static/style.css?v=20261117-ui1">
  <meta name="theme-color" content="#101513">
  <link rel="stylesheet" href="/static/interface.css?v=20261117-ui1">
  <link rel="stylesheet" href="/static/player.css?v=20261120-player1">
</head>
<body class="player-page">
  <div class="app-shell">
    <header class="topbar">
      <a class="brand-lockup brand-link" href="/">
        <div class="brand-mark">LF</div>
        <div>
          <div class="brand-name">LimeFun</div>
          <div class="brand-subtitle">YOUR PERSONAL CINEMA</div>
        </div>
      </a>
      <div class="topbar-actions">
        <a class="page-link" href="/">发现番剧</a>
        <a class="page-link is-active" href="/player.html">正在观看</a>
        <a class="page-link" href="/downloads.html">下载中心</a>
      </div>
    </header>

    <main class="workspace">
        <div class="selection-header">
          <div class="selection-copy">
            <div class="watch-eyebrow"><span class="watch-dot"></span><span id="libraryLabel">本地影院</span></div>
            <h1 id="seriesTitle">正在加载</h1>
            <div id="seriesMeta" class="muted-line"></div>
          </div>
          <button id="theaterButton" class="text-button theater-button" type="button" aria-pressed="false" aria-controls="playerRail"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14"/></svg><span>宽屏模式</span></button>
        </div>

        <div class="player-layout">
          <section class="player-panel" aria-label="视频播放器">
            <div class="video-frame">
              <video id="video" controls preload="metadata" playsinline></video>
              <div id="videoEmpty" class="video-empty">
                <div class="empty-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg></div>
                <strong>好故事，从这里开始</strong><span>从发现页打开一部本地番剧</span>
                <a href="/" class="empty-discover">去发现番剧 ↗</a>
              </div>
            </div>
            <div class="now-playing">
              <div class="now-playing-copy">
                <div class="playback-state"><span id="playbackStatus" role="status">待播放</span><span id="episodePosition"></span></div>
                <div id="episodeTitle" class="episode-title">未选择集数</div>
              </div>
              <div class="transport-controls">
                <label class="playback-speed" for="playbackRateSelect">
                  <span>倍速</span>
                  <select id="playbackRateSelect" aria-label="播放倍速">
                    <option value="0.5">0.5x</option>
                    <option value="1">1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                    <option value="2.5">2.5x</option>
                    <option value="3">3x</option>
                    <option value="4">4x</option>
                  </select>
                </label>
                <button id="prevButton" class="control-button" type="button" title="上一集" disabled>← 上一集</button>
                <button id="nextButton" class="control-button control-primary" type="button" title="下一集" disabled>下一集 →</button>
              </div>
            </div>
            <div class="player-footnote"><span>本地播放 · 沉浸于每个故事</span><label class="autoplay-option"><input id="autoNext" type="checkbox" checked> 自动连播</label></div>
          </section>

          <aside id="playerRail" class="player-rail" aria-label="选集与播放列表">
            <div class="watch-tabs" role="tablist" aria-label="播放侧栏">
              <button data-view="episodes" type="button" role="tab" aria-selected="true">选集 <span id="episodeCount" class="count-badge">0</span></button>
              <button data-view="library" type="button" role="tab" aria-selected="false">播放列表 <span id="playlistCount" class="count-badge">0</span></button>
            </div>
          <section id="episodesView" class="episode-panel" aria-label="集数列表">
            <div class="episode-header"><label class="season-picker" for="seasonSelect"><span>季 / 目录</span><select id="seasonSelect"></select></label></div>
            <div class="episode-tools"><label class="rail-search"><span class="sr-only">查找集数</span><input id="episodeSearch" type="search" placeholder="查找集数或名称" autocomplete="off"></label><button id="locateEpisode" class="locate-episode" type="button">当前集</button></div>
            <div class="episode-list-heading"><span id="seasonTitle">未选择目录</span><span id="episodeMatches"></span></div>
            <div id="episodeGrid" class="episode-grid"></div>
          </section>
          <section id="libraryView" class="library-sidebar" hidden>
            <div class="playlist-heading"><span class="muted-line">你的待看片单</span><button id="refreshButton" class="rail-refresh" type="button">刷新本地库</button></div>
            <label class="rail-search playlist-search"><span class="sr-only">查找播放列表</span><input id="playlistSearch" type="search" placeholder="查找片单中的番剧" autocomplete="off"></label>
            <div id="seriesList" class="series-list" aria-live="polite"></div>
            <a class="playlist-discover" href="/">发现更多番剧 <span aria-hidden="true">↗</span></a>
          </section>
          </aside>
        </div>
    </main>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="/static/interface.js?v=20261117-ui1"></script>
  <script src="/static/app.js?v=20261120-player1"></script>
</body>
</html>
