<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LimeFun Player</title>
  <link rel="stylesheet" href="/static/style.css?v=20261117-ui1">
  <meta name="theme-color" content="#101513">
  <link rel="stylesheet" href="/static/interface.css?v=20261117-ui1">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark">LF</div>
        <div>
          <div class="brand-name">LimeFun</div>
          <div class="brand-subtitle">本地番剧浏览器</div>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="search-box" for="searchInput">
          <span class="search-symbol">/</span>
          <input id="searchInput" type="search" placeholder="搜索番剧" autocomplete="off">
        </label>
        <button id="refreshButton" class="text-button" type="button">刷新索引</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="library-sidebar">
        <div class="library-tabs" role="tablist" aria-label="媒体库">
          <button class="library-tab is-active" data-root="archive" role="tab" type="button">番剧 <span id="archiveCount">0</span></button>
          <button class="library-tab" data-root="new" role="tab" type="button">新番 <span id="newCount">0</span></button>
        </div>
        <div class="sidebar-heading">
          <span>系列</span>
          <span id="seriesCount">0</span>
        </div>
        <div id="seriesList" class="series-list" aria-live="polite"></div>
      </aside>

      <section class="main-column">
        <div class="selection-header">
          <div>
            <div id="libraryLabel" class="kicker">番剧</div>
            <h1 id="seriesTitle">正在加载</h1>
            <div id="seriesMeta" class="muted-line"></div>
          </div>
          <label class="season-picker" for="seasonSelect">
            <span>季 / 目录</span>
            <select id="seasonSelect"></select>
          </label>
        </div>

        <div class="player-layout">
          <section class="player-panel" aria-label="视频播放器">
            <div class="video-frame">
              <video id="video" controls preload="metadata" playsinline></video>
              <div id="videoEmpty" class="video-empty">
                <div class="empty-mark">LF</div>
                <div>从右侧选择一集开始播放</div>
              </div>
            </div>
            <div class="now-playing">
              <div>
                <div class="kicker">正在播放</div>
                <div id="episodeTitle" class="episode-title">未选择集数</div>
              </div>
              <div class="transport-controls">
                <button id="prevButton" class="control-button" type="button" title="上一集">上一集</button>
                <button id="nextButton" class="control-button control-primary" type="button" title="下一集">下一集</button>
              </div>
            </div>
          </section>

          <section class="episode-panel" aria-label="集数列表">
            <div class="episode-header">
              <div>
                <div class="kicker">集数</div>
                <div id="seasonTitle" class="panel-title">本目录</div>
              </div>
              <div id="episodeCount" class="count-badge">0</div>
            </div>
            <div id="episodeGrid" class="episode-grid"></div>
          </section>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="/static/interface.js?v=20261117-ui1"></script>
  <script src="/static/app.js?v=20261117-ui1"></script>
</body>
</html>
